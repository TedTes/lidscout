# Railway scheduled worker service.
#
# Use this file as the Railway config source for a separate worker service
# created from the same repository. The API service should continue using
# railway.toml so it remains an always-on web process.

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
startCommand = "python -m workers.jobs run-daily-pipeline"
cronSchedule = "0 8 * * *"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 1